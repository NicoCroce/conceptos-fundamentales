/* Aplica la página (papel, sepia, tinta o noche) y los ajustes de lectura antes de pintar, para evitar un parpadeo.

.sec-discutir { background: var(--accent-soft); border-radius: 12px; padding: 4px 24px 12px; margin-top: 48px; }
.sec-discutir h2 { margin-top: 24px; }
.sec-discutir ul { padding-left: 1.2em; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--rule); font-family: var(--display); }
.pager a { display: block; text-decoration: none; color: var(--ink); padding: 14px 16px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); min-width: 0; }
.pager a:hover { border-color: var(--accent); }
.pager small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.pager span { display: block; font-weight: 700; font-size: 15px; margin-top: 2px; }
.pager .next { text-align: right; grid-column: 2; }
/* Pie de avance: porcentaje leído del tema actual. Queda pegado abajo mientras se lee y se actualiza con el scroll. */
.avance { grid-column: 1 / -1; position: sticky; bottom: 0; z-index: 15; margin-top: -24px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 9px 2px calc(9px + env(safe-area-inset-bottom, 0px)); background: var(--paper);
  font-family: var(--display); font-size: 13px; line-height: 1.2; color: var(--muted); font-variant-numeric: tabular-nums; }
.avance::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--rule); }
.avance::after { content: ""; position: absolute; left: 0; top: 0; height: 2px; width: calc(var(--avance, 0) * 1%); background: var(--accent); }
.avance .apct { font-weight: 700; color: var(--ink); }
/* Escuchar: parlante en cada título y reproductor flotante (voces del dispositivo, Web Speech API). */
.hablar { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; margin-left: 6px; padding: 0; vertical-align: middle; position: relative; top: -2px;
  border: 1px solid transparent; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; }
.hablar svg { width: 17px; height: 17px; }
.hablar:hover, .hablar:focus-visible, .hablar[aria-pressed="true"] { color: var(--accent); border-color: var(--rule); background: var(--surface); }
.titlerow .hablar { align-self: center; flex: none; margin-left: auto; top: 0; }
.leyendo { background: color-mix(in srgb, var(--accent) 13%, transparent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 13%, transparent); border-radius: 3px; }
.voz { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(56px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 2px; width: max-content; max-width: calc(100vw - 32px); padding: 5px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 999px; box-shadow: var(--shadow); font-family: var(--display); font-size: 13px; line-height: 1.2; }
.voz[hidden] { display: none; }
.voz .vbtn { flex: none; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 999px; background: none; color: inherit; cursor: pointer; font: inherit; font-weight: 700; font-variant-numeric: tabular-nums; }
.voz .vbtn:hover { background: var(--code-bg); }
.voz .vbtn svg { width: 18px; height: 18px; }
.voz #vozPlay { background: var(--ink); color: var(--paper); }
.voz .vvel { width: auto; padding: 0 10px; }
.voz .vtxt { flex: 0 1 auto; min-width: 0; max-width: 240px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
body.con-voz .toast { bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
.lectura .lgrupo[hidden] { display: none; }
.lectura .lsel { width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; font-size: 14px; }
body.con-avance .toc { max-height: calc(100vh - env(safe-area-inset-top, 0px) - 72px - 52px); }
body.con-avance .toast { bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }

/* ---------- Portada ---------- */
.cover h1 { font-size: clamp(38px, 5.6vw, 64px); line-height: 1; letter-spacing: -.03em; max-width: 15ch; }
.cover h1 em { font-style: normal; color: var(--accent); }
.cover .lede { max-width: 58ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; font-family: var(--display); margin: 8px 0 36px; }
.facts div { display: flex; flex-direction: column; }
.facts b { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.facts span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.anatomy { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 0; border-top: 1px solid var(--rule); }
.anatomy li { display: grid; grid-template-columns: 190px 1fr; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--rule); margin: 0; }
.anatomy li b { font-family: var(--display); font-weight: 700; font-size: 15px; }
.rumbo { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px 8px; margin: 8px 0 12px; }
.rumbo h3 { margin-top: 0 !important; }
.caps { display: grid; gap: 0; margin-top: 8px; }
.cap { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px 20px; padding: 24px 0; border-top: 1px solid var(--rule); }
.cap .capn { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.cap h3 { margin: 0 0 4px !important; }
.cap p { color: var(--muted); margin-bottom: 10px; }
.cap ol { list-style: none; padding: 0; margin: 0; columns: 2 240px; column-gap: 24px; }
.cap li { break-inside: avoid; margin: 0 0 4px; font-family: var(--display); font-size: 14.5px; display: flex; gap: 8px; }
.cap li .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 28px; }
.cap li a { color: var(--ink); text-decoration: none; }
.cap li a:hover { color: var(--accent); text-decoration: underline; }
.cap li .ck { color: var(--ok); }
.cap li .min { color: var(--muted); font-size: 12px; margin-left: auto; padding-left: 8px; white-space: nowrap; }
.plan { counter-reset: s; list-style: none; padding: 0; }
.plan li { counter-increment: s; position: relative; padding-left: 44px; margin-bottom: 14px; }
.plan li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-family: var(--display); font-weight: 800; font-size: 14px; display: grid; place-items: center; }

/* ---------- Glosario ---------- */
.gfilter { width: 100%; max-width: 420px; height: 42px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); padding: 0 12px; font-family: var(--display); font-size: 15px; margin: 8px 0 20px; }
.gletter { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--accent); margin: 28px 0 4px; }
.gl { margin: 0; }
.gl > div { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: 4px 20px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.gl dt { font-family: var(--display); font-weight: 700; font-size: 15.5px; }
.gl dd { margin: 0; }
.gl dd a { font-family: var(--display); font-size: 13px; white-space: nowrap; }

.foot { margin-top: 64px; font-family: var(--display); font-size: 12.5px; color: var(--muted); }

/* ---------- Resaltados y notas ---------- */
.c-amarillo { --hl-c: var(--hl-amarillo); }
.c-verde { --hl-c: var(--hl-verde); }
.c-azul { --hl-c: var(--hl-azul); }
.c-rosa { --hl-c: var(--hl-rosa); }
mark.hl { background: var(--hl-c); color: inherit; border-radius: 2px; padding: 0; cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
mark.hl.has-note { border-bottom: 2px dotted var(--muted); }
mark.hl.flash { outline: 2px solid var(--accent); outline-offset: 1px; }
.nav-extra .ncount, .ngroup .ncount { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }

.hlpop, .hledit { position: absolute; z-index: 40; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); font-family: var(--display); }
.hlpop[hidden], .hledit[hidden], .toast[hidden] { display: none; }
.hlpop { display: flex; align-items: center; gap: 4px; padding: 5px; }
.swatches { display: flex; gap: 4px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--rule); background: var(--hl-c); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.hlpop .txtbtn { border: 0; border-left: 1px solid var(--rule); background: none; padding: 4px 10px 4px 12px; height: 30px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--accent); }
.hledit { width: min(360px, calc(100vw - 32px)); padding: 14px; }
.hledit blockquote { margin: 0 0 10px; padding-left: 10px; border-left: 3px solid var(--hl-c, var(--rule)); font-family: var(--body); font-size: 14px; line-height: 1.45; color: var(--muted); max-height: 5.8em; overflow: hidden; }
.hledit label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.hledit textarea, .nota textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 8px 10px; font-family: var(--body); font-size: 15px; line-height: 1.45; }
.herow { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.herow .grow { flex: 1; }
.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-family: var(--display); font-size: 14px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: var(--danger); }
.btn.link { border: 0; background: none; padding: 2px 4px; color: var(--accent); font-weight: 600; }
.btn.link.danger { color: var(--danger); }

.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); max-width: min(520px, calc(100vw - 32px)); background: var(--ink); color: var(--paper); font-family: var(--display); font-size: 14px; line-height: 1.4; padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); }

.updbar { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 12px; max-width: calc(100vw - 32px); background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 8px 8px 8px 14px; font-family: var(--display); font-size: 14px; line-height: 1.35; }
.updbar[hidden] { display: none; }
/* Gráficos generados por build.py (cuadrante, calor, barras, triangulo, roles) */
.fig { margin: 28px 0; padding: 16px 18px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; font-family: var(--display); }
.fig figcaption { font-weight: 700; font-size: 15px; margin-bottom: 12px; }
.fig-leg { font-size: 12px; color: var(--muted); margin: 12px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.q-wrap { display: grid; grid-template-columns: 22px 1fr; grid-template-rows: auto auto; gap: 6px; }
.q-y { writing-mode: vertical-rl; transform: rotate(180deg); display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.q-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.q-x { grid-column: 2; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.q { border-radius: 8px; padding: 10px 12px; min-height: 92px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.3; }
.q b { font-size: 14px; margin-bottom: 2px; }
.q span::before { content: "· "; color: var(--muted); }
.q-arriba-derecha { background: var(--hl-rosa); }
.q-arriba-izquierda { background: var(--hl-azul); }
.q-abajo-derecha { background: var(--hl-amarillo); }
.q-abajo-izquierda { background: var(--code-bg); }
.hm { display: grid; grid-template-columns: 18px 1fr; grid-template-rows: auto auto; gap: 4px 6px; }
.hm-ylab { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.hm-xlab { grid-column: 2; text-align: center; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.hm-grid { display: grid; grid-template-columns: 16px repeat(5, 1fr); gap: 3px; align-items: stretch; }
.hm-n { font-size: 11px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.hm-c { min-height: 44px; border-radius: 4px; padding: 3px; display: flex; flex-direction: column; gap: 2px; font-size: 10.5px; line-height: 1.15; color: #141918; }
.hm-c span { background: rgb(255 255 255 / .7); border-radius: 3px; padding: 1px 3px; overflow-wrap: anywhere; }
.b1 { background: #BFE3C9; } .b2 { background: #F6DF8E; } .b3 { background: #F4B37A; } .b4 { background: #E98A8A; }
.hm-c span { font-weight: 700; text-align: center; }
.hm-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 16px; font-size: 13px; }
.hm-list b { display: inline-block; min-width: 28px; }
.hm-list span { color: var(--muted); font-size: 12px; }
.nw { white-space: nowrap; }
.hm-k { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-left: 4px; }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.bar-name { line-height: 1.25; }
.bar-track { height: 14px; background: var(--code-bg); border-radius: 4px; overflow: hidden; }
.bar-track i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar-val { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; white-space: nowrap; }
.fig-triangulo svg { display: block; width: 100%; max-width: 480px; margin: 0 auto; height: auto; }
.tri-shape { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
.tri-dot { fill: var(--accent); }
.tri-t { fill: var(--ink); font: 700 16px var(--display); text-anchor: middle; }
.tri-c { fill: var(--accent); font: 800 18px var(--display); text-anchor: middle; }
.tri-s { fill: var(--muted); font: 500 12px var(--display); text-anchor: middle; }
.roles-wrap { overflow-x: auto; }
table.roles { border-collapse: collapse; width: 100%; font-size: 13px; margin: 0; }
table.roles th, table.roles td { border-bottom: 1px solid var(--rule); padding: 7px 8px; text-align: center; vertical-align: middle; }
table.roles thead th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
table.roles tbody th { text-align: left; font-weight: 600; }
.rl { display: inline-block; min-width: 22px; padding: 2px 5px; margin: 1px; border-radius: 5px; font-weight: 800; font-size: 12px; color: #141918; }
.rl-r { background: #9FB4FF; } .rl-a { background: #F4B37A; } .rl-s { background: #BFE3C9; } .rl-c { background: #F6DF8E; } .rl-i { background: #D7DDD9; } .rl-x { background: var(--code-bg); color: var(--ink); }
/* Pareto, 5 porqués y árbol */
.pareto .bar-row:not(.vital) .bar-track i { background: var(--muted); opacity: .45; }
.pareto .bar-val b { color: var(--ink); }
.pk { display: inline-block; width: 14px; height: 9px; border-radius: 3px; background: var(--muted); opacity: .45; }
.pk.vital { background: var(--accent); opacity: 1; }
.why { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.why li { position: relative; margin-left: 14px; padding: 8px 12px 8px 18px; border-left: 2px solid var(--rule); font-size: 14px; line-height: 1.4; }
.why li::before { content: ""; position: absolute; left: -7px; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.why small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
.why .why-p { font-weight: 600; }
.why .why-p::before { background: var(--muted); border-color: var(--muted); }
.why .why-c { background: var(--warn-soft); color: var(--warn); border-radius: 0 8px 8px 0; font-weight: 600; }
.why .why-c::before { background: var(--warn); border-color: var(--warn); }
.why .why-c small { color: var(--warn); }
.why .why-a { background: var(--ok-soft); border-radius: 0 8px 8px 0; }
.why .why-a::before { background: var(--ok); border-color: var(--ok); }
.tree { font-size: 13.5px; line-height: 1.35; }
.tree-root { display: inline-block; font-weight: 800; font-size: 15px; padding: 6px 12px; border-radius: 8px; background: var(--accent); color: var(--surface); }
.tree ul { list-style: none; margin: 0; padding-left: 18px; }
.tree > ul { padding-left: 14px; }
.tree li { position: relative; padding: 5px 0 0 14px; }
.tree li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid var(--rule); }
.tree li:last-child::before { bottom: auto; height: 17px; }
.tree li::after { content: ""; position: absolute; left: 0; top: 17px; width: 10px; border-top: 2px solid var(--rule); }
.tree li > span { display: inline-block; padding: 2px 8px; border-radius: 6px; }
.tree li.t1 > span { font-weight: 700; color: #141918; }
.tree li.t1.br0 > span { background: #9FB4FF; } .tree li.t1.br1 > span { background: #BFE3C9; } .tree li.t1.br2 > span { background: #F6DF8E; }
.tree li.t1.br3 > span { background: #F4B37A; } .tree li.t1.br4 > span { background: #E9B4D0; } .tree li.t1.br5 > span { background: #B9E2E8; }
.tree li.t2 > span { background: var(--code-bg); }
/* Diagramas de Gantt generados por build.py a partir de bloques ```gantt */
.gantt { margin: 28px 0; padding: 16px 18px 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; font-family: var(--display); }
.gantt figcaption { font-weight: 700; font-size: 15px; margin-bottom: 12px; }
.g-row { display: grid; grid-template-columns: minmax(96px, 36%) 1fr; gap: 10px; align-items: center; min-height: 30px; border-top: 1px solid var(--rule); }
.g-row.g-head { border-top: 0; min-height: 22px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.g-name { font-size: 13px; line-height: 1.3; padding: 4px 0; }
.g-row.crit .g-name { font-weight: 700; }
.g-track { position: relative; height: 100%; min-height: 22px;
  background-image: linear-gradient(to right, var(--rule) 1px, transparent 1px); background-size: calc(100% / var(--n)) 100%; }
.g-head .g-track { background: none; }
.g-head b { position: absolute; left: calc(var(--s) / var(--n) * 100%); width: calc(100% / var(--n)); text-align: center; font-weight: 600; top: 4px; }
.g-bar { position: absolute; top: 50%; transform: translateY(-50%); height: 14px; border-radius: 4px;
  left: calc(var(--s) / var(--n) * 100%); width: calc(var(--d) / var(--n) * 100%); background: var(--accent); opacity: .55; }
.g-bar.crit { opacity: 1; background: var(--warn); }
.g-ms { position: absolute; top: 50%; width: 12px; height: 12px; left: calc(var(--s) / var(--n) * 100%);
  transform: translate(-50%, -50%) rotate(45deg); background: var(--accent); }
.g-ms.crit { background: var(--warn); }
.g-leg { font-size: 12px; color: var(--muted); margin: 10px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.g-key { display: inline-block; width: 18px; height: 9px; border-radius: 3px; background: var(--warn); margin-left: 6px; }
.g-key.ms { width: 9px; height: 9px; border-radius: 0; transform: rotate(45deg); background: var(--accent); margin-left: 10px; }
.perfiles { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.perfiles button { font-family: var(--display); font-size: 13px; font-weight: 600; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; }
.perfiles button:hover { border-color: var(--accent); }
.perfiles button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.perfdesc { color: var(--muted); font-size: 15px; margin: -6px 0 24px; }
a.btn { color: var(--ink); text-decoration: none; display: inline-block; }
a.btn.primary, .btn.primary { color: var(--surface); }
.respaldo .resumen { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 20px; margin: 8px 0 20px; font-family: var(--display); }
.respaldo .resumen b { font-variant-numeric: tabular-nums; }

<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var T = DATA.topics, CH = DATA.chapters, BUILD = DATA.build || {};
  var offlineReady = false;
  var ORDER = [];
  CH.forEach(function (c) { c.topics.forEach(function (s) { if (T[s]) ORDER.push(s); }); });
  var TOTAL = ORDER.length;
  var MIN = ORDER.reduce(function (a, s) { return a + T[s].lectura; }, 0);

  // ---- Perfiles: filtran el índice, la portada y el orden de "anterior / siguiente" ----
  var PERF = DATA.perfiles || [], PERF_KEY = "manual-aiml-perfil", perfil = "todo", INP = {};
  function perfOf(id) { return PERF.filter(function (p) { return p.id === id; })[0]; }
  function setPerfil(id, keep) {
    perfil = perfOf(id) ? id : "todo"; INP = {};
    var p = perfOf(perfil); if (p) p.topics.forEach(function (s) { INP[s] = 1; });
    if (!keep) { try { localStorage.setItem(PERF_KEY, perfil); } catch (e) {} }
  }
  function inPerfil(s) { return perfil === "todo" || !!INP[s]; }
  function visOrder() { return ORDER.filter(inPerfil); }
  function perfChips() {
    var h = '<div class="perfiles" role="group" aria-label="Filtrar temas por perfil">';
    [{ id: "todo", corto: "Todo", nombre: "Todos los temas" }].concat(PERF).forEach(function (p) {
      h += '<button type="button" data-perfil="' + p.id + '" aria-pressed="' + (perfil === p.id) + '" title="' + esc(p.nombre) + '">' + esc(p.corto) + "</button>";
    });
    return h + "</div>";
  }
  (function () { var v = null; try { v = localStorage.getItem(PERF_KEY); } catch (e) {} setPerfil(v || "todo", true); })();

  var $ = function (id) { return document.getElementById(id); };
  var main = $("main"), navBody = $("navBody"), q = $("q");

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function norm(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }

  // ---- Almacenamiento local: IndexedDB, y si no está disponible, solo memoria ----
  // Bases: "notas" (resaltados, índice por slug) y "ajustes" (clave/valor, p. ej. temas leídos).
  var Store = (function () {
    var db = null, state = "pendiente";
    function open() {
      return new Promise(function (resolve) {
        var done = false;
        function fin(d) { if (done) return; done = true; db = d; state = d ? "ok" : "no"; resolve(!!d); }
        try {
          if (!window.indexedDB) return fin(null);
          var r = indexedDB.open("manual-aiml", 1);
          r.onupgradeneeded = function () {
            var d = r.result;
            if (!d.objectStoreNames.contains("notas")) d.createObjectStore("notas", { keyPath: "id" }).createIndex("slug", "slug");
            if (!d.objectStoreNames.contains("ajustes")) d.createObjectStore("ajustes", { keyPath: "clave" });
          };
          r.onsuccess = function () {
            var d = r.result;
            d.onversionchange = function () { d.close(); db = null; state = "no"; };
            fin(d);
          };
          r.onerror = function (e) { if (e && e.preventDefault) e.preventDefault(); fin(null); };
          r.onblocked = function () { fin(null); };
          setTimeout(function () { fin(null); }, 3000);
        } catch (e) { fin(null); }
      });
    }
    function tx(name, mode, fn) {
      if (!db) return Promise.reject(new Error("IndexedDB no disponible"));
      return new Promise(function (res, rej) {
        try {
          var t = db.transaction(name, mode), out, r = fn(t.objectStore(name));
          if (r) r.onsuccess = function () { out = r.result; };
          t.oncomplete = function () { res(out); };
          t.onerror = function () { rej(t.error); };
          t.onabort = function () { rej(t.error || new Error("transacción abortada")); };
        } catch (e) { rej(e); }
      });
    }
    return {
      open: open,
      ok: function () { return state === "ok"; },
      state: function () { return state; },
      all: function () { return tx("notas", "readonly", function (s) { return s.getAll(); }); },
      put: function (rec) { return tx("notas", "readwrite", function (s) { return s.put(rec); }); },
      putMany: function (recs) { return tx("notas", "readwrite", function (s) { recs.forEach(function (x) { s.put(x); }); }); },
      del: function (id) { return tx("notas", "readwrite", function (s) { return s.delete(id); }); },
      get: function (k) { return tx("ajustes", "readonly", function (s) { return s.get(k); }).then(function (r) { return r ? r.valor : undefined; }); },
      set: function (k, v) { return tx("ajustes", "readwrite", function (s) { return s.put({ clave: k, valor: v }); }); }
    };
  })();
  var persistWarned = false;
  function persist(p) {
    return p.catch(function () {
      if (persistWarned) return;
      persistWarned = true;
      toast("Este navegador no permite guardar las notas: se perderán al cerrar la página. Usa «Exportar» en Mis notas para conservarlas.");
    });
  }

  // ---- Progreso de lectura (solo en este navegador) ----
  // Fuente de verdad: IndexedDB. localStorage queda como copia para pintar al instante y como respaldo.
  var KEY = "manual-aiml-leidos";
  var read = {};
  try { (JSON.parse(localStorage.getItem(KEY) || "[]") || []).forEach(function (s) { read[s] = 1; }); } catch (e) {}
  function save() {
    var arr = Object.keys(read);
    try { localStorage.setItem(KEY, JSON.stringify(arr)); } catch (e) {}
    if (Store.ok()) Store.set("leidos", arr).catch(function () {});
  }

  // ---- Índice lateral ----
  function parseHash() {
    var h = location.hash.slice(1);
    try { h = decodeURIComponent(h); } catch (e) {}
    var m = h.match(/^([a-z0-9-]+)\/nota\/(.+)$/);
    return m ? { v: m[1], nota: m[2] } : { v: h, nota: null };
  }
  function current() { var h = parseHash().v; return (T[h] || h === "glosario" || h === "notas" || h === "respaldo") ? h : "inicio"; }
  function navHTML() {
    var cur = current(), vis = visOrder(), N = vis.length, n = vis.filter(function (s) { return read[s]; }).length;
    var h = perfChips();
    h += '<div class="prog"><span id="progTxt">' + n + " de " + N + ' temas leídos</span><div class="bar"><i style="width:' + (N ? n / N * 100 : 0) + '%"></i></div></div>';
    CH.forEach(function (c) {
      var ts = c.topics.filter(function (s) { return T[s] && inPerfil(s); });
      if (!ts.length) return;
      h += '<div class="nav-cap"><h4><span>' + c.n + "</span>" + esc(c.titulo) + "</h4><ul>";
      ts.forEach(function (s) {
        var t = T[s];
        h += '<li><a href="#' + s + '"' + (cur === s ? ' aria-current="page"' : "") + '><span class="n">' + t.num + "</span><span>" + esc(t.titulo) + '</span><span class="ck" aria-label="' + (read[s] ? "leído" : "") + '">' + (read[s] ? "✓" : "") + "</span></a></li>";
      });
      h += "</ul></div>";
    });
    var nn = noteCount();
    h += '<div class="nav-extra"><a href="#notas"' + (cur === "notas" ? ' aria-current="page"' : "") + ">Mis notas" + (nn ? '<span class="ncount">' + nn + "</span>" : "") + "</a>" +
      '<a href="#glosario"' + (cur === "glosario" ? ' aria-current="page"' : "") + ">Glosario</a>" +
      '<a href="#respaldo"' + (cur === "respaldo" ? ' aria-current="page"' : "") + ">Pasar a otro dispositivo</a></div>";
    return h;
  }
  function renderNav() { if (!q.value.trim()) navBody.innerHTML = navHTML(); }

  // ---- Búsqueda ----
  var IDX = ORDER.map(function (s) {
    var t = T[s];
    return { s: s, title: norm(t.titulo), heads: norm(t.toc.map(function (x) { return x.text; }).join(" | ")), res: norm(t.resumen), body: norm(t.text), raw: t.text };
  });
  var GIDX = (DATA.glosario || []).map(function (g) { return { g: g, k: norm(g.termino + " " + g.definicion) }; });
  function snippet(raw, nb, words) {
    var pos = -1;
    for (var i = 0; i < words.length && pos < 0; i++) pos = nb.indexOf(words[i]);
    if (pos < 0) return "";
    var a = Math.max(0, pos - 60), b = Math.min(raw.length, pos + 110);
    var s = (a > 0 ? "…" : "") + raw.slice(a, b) + (b < raw.length ? "…" : "");
    var out = esc(s);
    words.forEach(function (w) {
      if (w.length < 3) return;
      var ns = norm(out), idx = ns.indexOf(w);
      if (idx >= 0) out = out.slice(0, idx) + "<mark>" + out.slice(idx, idx + w.length) + "</mark>" + out.slice(idx + w.length);
    });
    return out;
  }
  function search(str) {
    var words = norm(str).split(/\s+/).filter(Boolean);
    if (!words.length) return null;
    var res = [];
    IDX.forEach(function (d) {
      var sc = 0, ok = true;
      words.forEach(function (w) {
        var hit = 0;
        if (d.title.indexOf(w) >= 0) hit += 12;
        if (d.heads.indexOf(w) >= 0) hit += 5;
        if (d.res.indexOf(w) >= 0) hit += 3;
        var c = d.body.split(w).length - 1; hit += Math.min(c, 8);
        if (!hit) ok = false; sc += hit;
      });
      if (ok) res.push({ s: d.s, sc: sc });
    });
    res.sort(function (a, b) { return b.sc - a.sc; });
    var g = GIDX.filter(function (x) { return words.every(function (w) { return x.k.indexOf(w) >= 0; }); }).slice(0, 3);
    return { words: words, res: res.slice(0, 12), g: g };

      }
    });
  }

  function route() {
    hidePop(); closeEditor(); pararVoz();
    var v = current();
    if (v === "notas") {
      main.className = "main"; main.innerHTML = viewNotas(); setupNotas(); renderNotas();
      $("topTitle").textContent = "Mis notas";
    } else if (v === "respaldo") {
      main.className = "main"; main.innerHTML = viewRespaldo(); setupRespaldo();
      $("topTitle").textContent = "Pasar a otro dispositivo";
    } else if (v === "glosario") {
      main.className = "main"; main.innerHTML = viewGlosario(); renderGlist("");
      $("gf").addEventListener("input", function (e) { renderGlist(e.target.value); });
      $("topTitle").textContent = "Glosario";
    } else if (T[v]) {
      main.className = "main with-toc"; main.innerHTML = viewTopic(v);
      $("topTitle").textContent = T[v].num + " · " + T[v].titulo;
      $("readBtn").addEventListener("click", function () {
        if (read[v]) delete read[v]; else read[v] = 1;
        save();
        this.setAttribute("aria-pressed", read[v] ? "true" : "false");
        this.textContent = read[v] ? "✓ Leído" : "Marcar como leído";
        renderNav();
      });
      applyHighlights(v);
      ponerParlantes(v);
    } else {
      main.className = "main"; main.innerHTML = viewInicio();
      $("topTitle").textContent = "Manual de AI/ML y Plataforma";
    }
    renderNav(); setupToc(); closeDrawer();
    window.scrollTo(0, 0);
    document.body.classList.toggle("con-avance", !!T[v]);
    if (T[v]) goToNote(parseHash().nota);
    pedirAvance();
  }
  // ---- Escuchar: lee el tema en voz alta con las voces que trae el dispositivo (Web Speech API) ----
  // Nada se descarga ni se genera: el sistema operativo pone la voz. Se lee por trozos cortos porque algunos
  // navegadores cortan los textos largos; pausar cancela y retomar repite el trozo, que es lo que funciona en todos.
  var tts = ("speechSynthesis" in window && window.SpeechSynthesisUtterance) ? window.speechSynthesis : null;
  var VOZ_KEY = "manual-aiml-voz", VELS = [0.8, 1, 1.2, 1.5];
  var vozCfg = (function () { try { return JSON.parse(localStorage.getItem(VOZ_KEY) || "null") || {}; } catch (e) { return {}; } })();
  if (VELS.indexOf(vozCfg.vel) < 0) vozCfg.vel = 1;
  var voz = { cola: [], i: 0, tok: 0, estado: "parado", btn: null, marcado: null };
  var ICO_PARL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  var ICO_PAUSA = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  var ICO_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15L19.5 12z"/></svg>';
  function guardarVoz() { try { localStorage.setItem(VOZ_KEY, JSON.stringify(vozCfg)); } catch (e) {} }
  function vocesEs() { return tts ? tts.getVoices().filter(function (v) { return /^es\b|^es[-_]/i.test(v.lang); }) : []; }
  var LANG_PREF = ["es-419", "es-MX", "es-US", "es-AR", "es-CO", "es-CL", "es-ES"];
  function puntaje(v) {
    var l = v.lang.replace("_", "-"), r = LANG_PREF.indexOf(l);
    return (r < 0 ? 8 : r) + (v.localService ? 0 : 20) + (/Eddy|Flo|Grand|Reed|Rocko|Sandy|Shelley/.test(v.name) ? 10 : 0);
  }
  function elegirVoz() {
    var vs = vocesEs();
    if (vozCfg.voz) { var f = vs.filter(function (v) { return v.voiceURI === vozCfg.voz; })[0]; if (f) return f; }
    return vs.sort(function (a, b) { return puntaje(a) - puntaje(b); })[0] || null;
  }
  function llenarVoces() {
    if (!tts) return;
    $("lVozG").hidden = false;
    var vs = vocesEs().sort(function (a, b) { return puntaje(a) - puntaje(b); }), sel = $("lVoz");
    var h = '<option value="">' + (vs.length ? "Automática" : "La del sistema (no hay voces en castellano)") + "</option>";
    vs.forEach(function (v) { h += '<option value="' + esc(v.voiceURI) + '">' + esc(v.name + " · " + v.lang) + (v.localService ? "" : " · en línea") + "</option>"; });
    sel.innerHTML = h; sel.value = vozCfg.voz && vs.some(function (v) { return v.voiceURI === vozCfg.voz; }) ? vozCfg.voz : "";
  }
  if (tts) {
    llenarVoces();
    if ("onvoiceschanged" in tts) tts.addEventListener("voiceschanged", llenarVoces);
    $("lVoz").addEventListener("change", function () { vozCfg.voz = this.value || null; guardarVoz(); if (voz.estado === "hablando") { voz.tok++; tts.cancel(); hablar(); } });
    window.addEventListener("pagehide", function () { tts.cancel(); });
  }

  function textoDe(el) {
    var c = el.cloneNode(true);
    c.querySelectorAll("ul, ol, pre, table, figure, button, .hablar").forEach(function (x) { x.remove(); });
    return c.textContent.replace(/\s+/g, " ").trim();
  }
  function trozos(t) {
    var out = [], cur = "", partes = t.match(/[^.!?;:]+[.!?;:]*[\s»”")]*|[.!?;:]+/g) || [t];
    partes.forEach(function (p) {
      if (cur && (cur + p).length > 180) { out.push(cur.trim()); cur = ""; }
      while (p.length > 180) { var k = p.lastIndexOf(" ", 180); if (k < 60) k = 180; out.push(p.slice(0, k).trim()); p = p.slice(k); }
      cur += p;
    });
    if (cur.trim()) out.push(cur.trim());
    return out;
  }
  // Recorre el tema en orden y arma la cola: un elemento por párrafo, ítem o título; código, tablas y gráficos se anuncian.
  function recoger(node, out, ctx) {
    [].forEach.call(node.children, function (el) {
      var tag = el.tagName, cls = typeof el.className === "string" ? el.className : "";
      if (/^H[1-6]$/.test(tag)) { ctx.sec = textoDe(el); out.push({ el: el, txt: ctx.sec, sec: ctx.sec }); }
      else if (/^(P|DT|DD)$/.test(tag)) { var t = textoDe(el); if (t) out.push({ el: el, txt: t, sec: ctx.sec }); }
      else if (tag === "LI") {
        var tl = textoDe(el); if (tl) out.push({ el: el, txt: tl, sec: ctx.sec });
        el.querySelectorAll(":scope > ul, :scope > ol").forEach(function (l) { recoger(l, out, ctx); });
      }
      else if (tag === "PRE") out.push({ el: el, txt: "Sigue un bloque de código.", sec: ctx.sec });
      else if (tag === "TABLE") out.push({ el: el, txt: "Sigue una tabla.", sec: ctx.sec });
      else if (tag === "FIGURE" || /\b(tree|roles-wrap|bars)\b/.test(cls)) out.push({ el: el, txt: "Sigue un gráfico.", sec: ctx.sec });
      else if (!/^(HR|BUTTON|SCRIPT|STYLE|svg)$/i.test(tag)) recoger(el, out, ctx);
    });
  }
  function colaDesde(h) {
    var c = $("tcontent"), out = [], ctx = { sec: "" };
    if (h.tagName === "H1") {
      ctx.sec = textoDe(h); out.push({ el: h, txt: ctx.sec, sec: ctx.sec });
      var lede = main.querySelector("article .lede"); if (lede) out.push({ el: lede, txt: textoDe(lede), sec: ctx.sec });
    }
    var todo = []; recoger(c, todo, { sec: ctx.sec });
    var k = h.tagName === "H1" ? 0 : todo.map(function (x) { return x.el; }).indexOf(h);
    out = out.concat(todo.slice(Math.max(0, k)));
    var cola = [];
    out.forEach(function (it) { trozos(it.txt).forEach(function (t) { cola.push({ el: it.el, txt: t, sec: it.sec }); }); });
    return cola;
  }
  function marcar(el) {
    if (voz.marcado === el) return;
    if (voz.marcado) voz.marcado.classList.remove("leyendo");
    voz.marcado = el; if (!el) return;
    el.classList.add("leyendo");
    var r = el.getBoundingClientRect();
    if (r.top < 80 || r.bottom > window.innerHeight - 130) el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
  function pintarVoz() {
    var on = voz.estado !== "parado";
    $("voz").hidden = !on; document.body.classList.toggle("con-voz", on);
    var habla = voz.estado === "hablando", pb = $("vozPlay");
    pb.innerHTML = habla ? ICO_PAUSA : ICO_PLAY;
    pb.setAttribute("aria-label", habla ? "Pausar" : "Seguir escuchando"); pb.title = pb.getAttribute("aria-label");
    $("vozVel").textContent = String(vozCfg.vel).replace(".", ",") + "×";
    var it = voz.cola[voz.i]; $("vozTxt").textContent = it ? (habla ? "Leyendo: " : "En pausa: ") + it.sec : "";
    main.querySelectorAll(".hablar").forEach(function (b) { b.setAttribute("aria-pressed", b === voz.btn && habla ? "true" : "false"); });
  }
  function hablar() {
    var tok = ++voz.tok;
    if (voz.i >= voz.cola.length) { pararVoz(); toast("Terminó la lectura del tema."); return; }
    var it = voz.cola[voz.i];
    voz.estado = "hablando"; marcar(it.el); pintarVoz();
    var u = new SpeechSynthesisUtterance(it.txt), v = elegirVoz();
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "es-ES";
    u.rate = vozCfg.vel;
    u.onend = function () { if (tok !== voz.tok || voz.estado !== "hablando") return; voz.i++; hablar(); };
    u.onerror = function (e) {
      if (tok !== voz.tok || e.error === "interrupted" || e.error === "canceled") return;
      if (e.error === "not-allowed") { pararVoz(); toast("El navegador no dejó reproducir la voz. Toca el parlante otra vez."); return; }
      voz.i++; hablar();
    };
    tts.speak(u);
  }
  function empezarVoz(h, btn) {
    if (!tts) return;
    voz.tok++; tts.cancel();
    voz.cola = colaDesde(h); voz.i = 0; voz.btn = btn;
    if (!voz.cola.length) return;
    hablar();
  }
  function pausarVoz() { if (voz.estado !== "hablando") return; voz.tok++; voz.estado = "pausado"; tts.cancel(); pintarVoz(); }
  function pararVoz() {
    if (!tts) return;
    voz.tok++; tts.cancel(); voz.estado = "parado"; voz.cola = []; voz.i = 0; voz.btn = null; marcar(null); pintarVoz();
  }
  function saltarVoz(d) {
    if (!voz.cola.length) return;
    var el = voz.cola[voz.i] && voz.cola[voz.i].el, j = voz.i;
    if (d > 0) { while (j < voz.cola.length && voz.cola[j].el === el) j++; }
    else {
      while (j > 0 && voz.cola[j - 1].el === el) j--;            // inicio del bloque actual
      if (j > 0) { var prev = voz.cola[j - 1].el; j--; while (j > 0 && voz.cola[j - 1].el === prev) j--; }
    }
    voz.i = Math.min(j, voz.cola.length); voz.tok++; tts.cancel(); hablar();
  }
  function ponerParlantes(v) {
    if (!tts || !T[v]) return;
    var heads = [main.querySelector("article h1")].concat([].slice.call($("tcontent").querySelectorAll("h2, h3")));
    heads.forEach(function (h) {
      if (!h) return;
      var b = document.createElement("button");
      b.type = "button"; b.className = "hablar"; b.innerHTML = ICO_PARL;
      b.title = h.tagName === "H1" ? "Escuchar el tema completo" : "Escuchar desde esta sección";
      b.setAttribute("aria-label", b.title + ": " + textoDe(h)); b.setAttribute("aria-pressed", "false");
      b._h = h;
      if (h.tagName === "H1") h.parentNode.appendChild(b); else h.appendChild(b);
    });
  }
  main.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest(".hablar"); if (!b) return;
    e.preventDefault();
    if (voz.btn === b && voz.estado === "hablando") pausarVoz();
    else if (voz.btn === b && voz.estado === "pausado") hablar();
    else empezarVoz(b._h, b);
  });
  $("vozPlay").addEventListener("click", function () { voz.estado === "hablando" ? pausarVoz() : hablar(); });
  $("vozStop").addEventListener("click", pararVoz);
  $("vozPrev").addEventListener("click", function () { saltarVoz(-1); });
  $("vozNext").addEventListener("click", function () { saltarVoz(1); });
  $("vozVel").addEventListener("click", function () {
    vozCfg.vel = VELS[(VELS.indexOf(vozCfg.vel) + 1) % VELS.length]; guardarVoz();
    if (voz.estado === "hablando") { voz.tok++; tts.cancel(); hablar(); } else pintarVoz();
  });

  // ---- Pie de avance: 0 % arriba de todo, 100 % al llegar al final de la página ----
  var avPend = false;
  function updateAvance() {
    avPend = false;
    var bar = $("avance"); if (!bar) return;
    var t = T[current()]; if (!t) return;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var pct = max > 4 ? Math.round(Math.min(1, Math.max(0, window.scrollY / max)) * 100) : 100;
    if (bar.getAttribute("aria-valuenow") === String(pct) && bar.dataset.ok) return;
    bar.dataset.ok = "1";
    bar.style.setProperty("--avance", pct);
    bar.setAttribute("aria-valuenow", pct);
    $("avancePct").textContent = pct + " %";
    var rest = Math.ceil(t.lectura * (100 - pct) / 100);
    $("avanceRest").textContent = pct >= 100 ? "Fin del tema" : pct === 0 ? t.lectura + " min de lectura" : "Quedan ~" + Math.max(1, rest) + " min";
  }
  function pedirAvance() { if (!avPend) { avPend = true; requestAnimationFrame(updateAvance); } }
  window.addEventListener("scroll", pedirAvance, { passive: true });
  window.addEventListener("resize", pedirAvance);

  // ---- Retomar la lectura: cada 10 segundos se guarda la vista y la posición del scroll ----
  // Al abrir el manual sin una ruta (o en la misma vista guardada) se vuelve a esa página y a ese punto.
  // La posición se guarda también como proporción, para que sirva aunque cambie el tamaño de letra o de ventana.
  var POS_KEY = "manual-aiml-posicion", posUlt = "";
  function leerPos() { try { var o = JSON.parse(localStorage.getItem(POS_KEY) || "null"); return o && typeof o.vista === "string" ? o : null; } catch (e) { return null; } }
  function guardarPos() {
    var max = document.documentElement.scrollHeight - window.innerHeight, y = Math.max(0, Math.round(window.scrollY));
    var p = { vista: current(), y: y, r: max > 0 ? Math.min(1, +(y / max).toFixed(4)) : 0 };
    var k = JSON.stringify(p); if (k === posUlt) return;
    posUlt = k; p.t = Date.now();
    try { localStorage.setItem(POS_KEY, JSON.stringify(p)); } catch (e) {}
  }
  function irAPos(p) {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var y = p.r > 0 && max > 0 ? Math.round(p.r * max) : (p.y || 0);
    window.scrollTo({ top: y, behavior: "instant" });
  }
  var posIni = leerPos(), hIni = parseHash(), retomar = false;
  if (posIni && !hIni.nota && (T[posIni.vista] || /^(glosario|notas|respaldo)$/.test(posIni.vista))) {
    if (!hIni.v) { history.replaceState(null, "", "#" + posIni.vista); retomar = true; }
    else if (hIni.v === posIni.vista) retomar = true;
  }

  window.addEventListener("hashchange", route);
  route();
  if (retomar && (posIni.y > 0 || posIni.r > 0)) {
    irAPos(posIni);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (current() === posIni.vista) irAPos(posIni); });
    if (T[posIni.vista]) toast("Retomaste donde quedaste: " + T[posIni.vista].num + " · " + T[posIni.vista].titulo + " (" + Math.round(posIni.r * 100) + " %)");
  }
  setInterval(guardarPos, 10000);
  window.addEventListener("pagehide", guardarPos);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") guardarPos(); });

  // ---- Service worker: guarda el manual completo para leerlo sin conexión ----
  // Solo en la versión publicada (BUILD.sw). Una versión nueva se instala en segundo plano y espera a que
  // el lector pulse "Actualizar", para no recargar la página en medio de una lectura o una nota.
  if (BUILD.sw && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    var reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (reloading) return; reloading = true; location.reload();
    });
    var offerUpdate = function (w) {
      if (!w || !navigator.serviceWorker.controller) return;
      $("updbar").hidden = false;
      $("updBtn").onclick = function () { w.postMessage("SKIP_WAITING"); $("updBtn").disabled = true; };
    };
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        if (reg.waiting) offerUpdate(reg.waiting);
        reg.addEventListener("updatefound", function () {
          var w = reg.installing; if (!w) return;
          w.addEventListener("statechange", function () { if (w.state === "installed") offerUpdate(w); });
        });
        // Al volver a la pestaña tras un rato, buscar una versión nueva.
        document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") reg.update().catch(function () {}); });
        return navigator.serviceWorker.ready;
      }).then(function () {
        offlineReady = true;
        var vt = $("verTxt"); if (vt) vt.textContent = vt.textContent.replace(/\.$/, "") + " · disponible sin conexión en este navegador.";
      }).catch(function () {});
    });
  }

  // Carga asíncrona: notas y progreso desde IndexedDB (con migración del progreso que estaba en localStorage).
  Store.open().then(function (ok) {
    if (!ok) return [[], undefined];
    return Promise.all([Store.all(), Store.get("leidos")]).catch(function () { return [[], undefined]; });
  }).then(function (r) {
    (r[0] || []).forEach(function (n) { if (n && n.id && !NOTES[n.id]) NOTES[n.id] = n; });
    var stored = r[1], changedRead = false;
    if (Array.isArray(stored)) {
      var before = Object.keys(read).sort().join(","), after = stored.slice().sort().join(",");
      if (before !== after) {
        read = {}; stored.forEach(function (s) { read[s] = 1; }); changedRead = true;
        try { localStorage.setItem(KEY, JSON.stringify(stored)); } catch (e) {}
      }
    } else if (Store.ok()) {
      Store.set("leidos", Object.keys(read)).catch(function () {});
    }
    notesReady = true;
    var v = current();
    renderNav();
    if (v === "inicio" && changedRead) main.innerHTML = viewInicio();
    else if (v === "notas") renderNotas();
    else if (T[v]) {
      var rb = $("readBtn");
      if (rb && changedRead) { rb.setAttribute("aria-pressed", read[v] ? "true" : "false"); rb.textContent = read[v] ? "✓ Leído" : "Marcar como leído"; }
      applyHighlights(v);
      if (pendingNote) { var id = pendingNote; pendingNote = null; goToNote(id); }
    }
  });
})();
</script>
