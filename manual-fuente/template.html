<style>
/* Layout: manual técnico de tres columnas — índice por capítulos a la izquierda, lectura a ~68 caracteres al centro,
   "en esta página" a la derecha en pantallas anchas. Número de sección (1.3) como sistema de navegación real. */
:root {

  --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Literata", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --side: 288px;
  --toc: 230px;
  --top: 56px;
  --hl-amarillo: #FFE58A; --hl-verde: #BDEBC8; --hl-azul: #CAD5FF; --hl-rosa: #FFCDE0;
  --warn: #8A5A00; --warn-soft: #FFF1D6;
  --shadow: 0 10px 30px rgb(20 25 24 / .16), 0 2px 6px rgb(20 25 24 / .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1313; --surface: #161B1B; --ink: #E3E8E5; --muted: #9AA4A0; --rule: #2A3231;
    --accent: #95A7FF; --accent-soft: #1D2546; --mark: #6A5813; --code-bg: #1B2221; --ok: #5CC58F; --ok-soft: #173326;
    --hl-amarillo: #5E4F12; --hl-verde: #1E4C33; --hl-azul: #28366E; --hl-rosa: #5E2341;
    --warn: #F2C26B; --warn-soft: #3A2C10;
    --shadow: 0 10px 30px rgb(0 0 0 / .5), 0 2px 6px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1313; --surface: #161B1B; --ink: #E3E8E5; --muted: #9AA4A0; --rule: #2A3231;
  --accent: #95A7FF; --accent-soft: #1D2546; --mark: #6A5813; --code-bg: #1B2221; --ok: #5CC58F; --ok-soft: #173326;
  --hl-amarillo: #5E4F12; --hl-verde: #1E4C33; --hl-azul: #28366E; --hl-rosa: #5E2341;
  --warn: #F2C26B; --warn-soft: #3A2C10;
  --shadow: 0 10px 30px rgb(0 0 0 / .5), 0 2px 6px rgb(0 0 0 / .3);
  color-scheme: dark;

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));

}

a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button { font: inherit; color: inherit; }

/* ---------- Barra superior (móvil) ---------- */
.topbar {
  display: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  height: var(--top); align-items: center; gap: 12px;

  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); gap: 48px; max-width: 1360px; margin: 0 auto; }

.search { position: relative; margin-bottom: 18px; }

/* Botón de tema fijo arriba a la derecha en escritorio (en móvil vive en la barra superior). */
.themefab { position: fixed; z-index: 22; top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); }

.nav-cap { margin-bottom: 16px; }

.nav-extra a:hover, .nav-extra a[aria-current="page"] { background: var(--accent-soft); }

.results { list-style: none; margin: 0; padding: 0; }

/* ---------- Contenido ---------- */
.main { min-width: 0; padding-block: 40px 96px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 48px; }
.main.with-toc { grid-template-columns: minmax(0, 1fr) var(--toc); }
article { min-width: 0; max-width: 70ch; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; font-family: var(--display); font-size: 13px; max-height: calc(100vh - 64px); overflow-y: auto; }
.toc h5 { margin: 0 0 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* ---------- Portada ---------- */
.cover h1 { font-size: clamp(38px, 5.6vw, 64px); line-height: 1; letter-spacing: -.03em; max-width: 15ch; }

/* ---------- Resaltados y notas ---------- */
.c-amarillo { --hl-c: var(--hl-amarillo); }
.c-verde { --hl-c: var(--hl-verde); }
.c-azul { --hl-c: var(--hl-azul); }
.c-rosa { --hl-c: var(--hl-rosa); }

.nav-extra .ncount, .ngroup .ncount { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }

.hlpop, .hledit { position: absolute; z-index: 40; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); font-family: var(--display); }

.sw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }

.hledit label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.hledit textarea, .nota textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 8px 10px; font-family: var(--body); font-size: 15px; line-height: 1.45; }
.herow { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.herow .grow { flex: 1; }
.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-family: var(--display); font-size: 14px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: #C23B3B; }
:root[data-theme="dark"] .btn.danger { color: #FF8A8A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.danger { color: #FF8A8A; } }
.btn.link { border: 0; background: none; padding: 2px 4px; color: var(--accent); font-weight: 600; }
.btn.link.danger { color: #C23B3B; }
:root[data-theme="dark"] .btn.link.danger { color: #FF8A8A; }

          '<div class="herow"><span class="grow"></span><button type="button" class="btn" data-act="cancelar">Cancelar</button><button type="button" class="btn primary" data-act="guardar">Guardar</button></div></div>';
        b.hidden = true;
        card.querySelector("textarea").focus();
      } else if (act === "guardar") {
        updateNote(rec, { comentario: card.querySelector("textarea").value.trim() });
        renderNotas();
      } else if (act === "cancelar") {
        renderNotas();
      }
    });
  }

  function route() {
    hidePop(); closeEditor();
    var v = current();
    if (v === "notas") {
      main.className = "main"; main.innerHTML = viewNotas(); setupNotas(); renderNotas();
      $("topTitle").textContent = "Mis notas";
    } else if (v === "respaldo") {
      main.className = "main"; main.innerHTML = viewRespaldo(); setupRespaldo();
      $("topTitle").textContent = "Pasar a otro dispositivo";
    } else if (v === "glosario") {
      main.className = "main"; main.innerHTML = viewGlosario(); renderGlist("");
      $("gf").addEventListener("input", function (e) { renderGlist(e.target.value); });
      $("topTitle").textContent = "Glosario";
    } else if (T[v]) {
      main.className = "main with-toc"; main.innerHTML = viewTopic(v);
      $("topTitle").textContent = T[v].num + " · " + T[v].titulo;
      $("readBtn").addEventListener("click", function () {
        if (read[v]) delete read[v]; else read[v] = 1;
        save();
        this.setAttribute("aria-pressed", read[v] ? "true" : "false");
        this.textContent = read[v] ? "✓ Leído" : "Marcar como leído";
        renderNav();
      });
      applyHighlights(v);
    } else {
      main.className = "main"; main.innerHTML = viewInicio();
      $("topTitle").textContent = "Manual de AI/ML y Plataforma";
    }
    renderNav(); setupToc(); closeDrawer();
    window.scrollTo(0, 0);
    if (T[v]) goToNote(parseHash().nota);
  }
  window.addEventListener("hashchange", route);
  route();

  // ---- Service worker: guarda el manual completo para leerlo sin conexión ----
  // Solo en la versión publicada (BUILD.sw). Una versión nueva se instala en segundo plano y espera a que
  // el lector pulse "Actualizar", para no recargar la página en medio de una lectura o una nota.
  if (BUILD.sw && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    var reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (reloading) return; reloading = true; location.reload();
    });
    var offerUpdate = function (w) {
      if (!w || !navigator.serviceWorker.controller) return;
      $("updbar").hidden = false;
      $("updBtn").onclick = function () { w.postMessage("SKIP_WAITING"); $("updBtn").disabled = true; };
    };
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        if (reg.waiting) offerUpdate(reg.waiting);
        reg.addEventListener("updatefound", function () {
          var w = reg.installing; if (!w) return;
          w.addEventListener("statechange", function () { if (w.state === "installed") offerUpdate(w); });
        });
        // Al volver a la pestaña tras un rato, buscar una versión nueva.
        document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") reg.update().catch(function () {}); });
        return navigator.serviceWorker.ready;
      }).then(function () {
        offlineReady = true;
        var vt = $("verTxt"); if (vt) vt.textContent = vt.textContent.replace(/\.$/, "") + " · disponible sin conexión en este navegador.";
      }).catch(function () {});
    });
  }

  // Carga asíncrona: notas y progreso desde IndexedDB (con migración del progreso que estaba en localStorage).
  Store.open().then(function (ok) {
    if (!ok) return [[], undefined];
    return Promise.all([Store.all(), Store.get("leidos")]).catch(function () { return [[], undefined]; });
  }).then(function (r) {
    (r[0] || []).forEach(function (n) { if (n && n.id && !NOTES[n.id]) NOTES[n.id] = n; });
    var stored = r[1], changedRead = false;
    if (Array.isArray(stored)) {
      var before = Object.keys(read).sort().join(","), after = stored.slice().sort().join(",");
      if (before !== after) {
        read = {}; stored.forEach(function (s) { read[s] = 1; }); changedRead = true;
        try { localStorage.setItem(KEY, JSON.stringify(stored)); } catch (e) {}
      }
    } else if (Store.ok()) {
      Store.set("leidos", Object.keys(read)).catch(function () {});
    }
    notesReady = true;
    var v = current();
    renderNav();
    if (v === "inicio" && changedRead) main.innerHTML = viewInicio();
    else if (v === "notas") renderNotas();
    else if (T[v]) {
      var rb = $("readBtn");
      if (rb && changedRead) { rb.setAttribute("aria-pressed", read[v] ? "true" : "false"); rb.textContent = read[v] ? "✓ Leído" : "Marcar como leído"; }
      applyHighlights(v);
      if (pendingNote) { var id = pendingNote; pendingNote = null; goToNote(id); }
    }
  });
})();
</script>
